[package]
name = "croner"
version = "3.0.1"
edition = "2021"
license = "MIT"
description = "Fully-featured, lightweight, and efficient Rust library designed for parsing and evaluating cron patterns"
repository = "https://github.com/hexagon/croner-rust"
documentation = "https://docs.rs/croner"
readme = "README.md"
keywords = ["cron", "scheduler", "job", "task", "time"]
categories = ["date-and-time", "parser-implementations"]
homepage = "https://github.com/hexagon/croner-rust"

[lib]
name = "croner"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, optional = true }
derive_builder = "0.20.2"
jiff = { version = "0.2.35", default-features = false, features = [
    "alloc",
], optional = true }
serde = { version = "1.0", optional = true }
strum = { version = "0.27.2", features = ["derive"] }

[dev-dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"
criterion = "0.7.0"
jiff = "0.2.35"
rstest = "0.26.1"
serde_test = "1.0"

[features]
default = ["chrono"]
# Support for `chrono::DateTime` and `chrono::NaiveDateTime`.
chrono = ["dep:chrono"]
# Support for `jiff::Zoned` and `jiff::civil::DateTime`.
jiff = ["dep:jiff"]
serde = ["dep:serde"]

[[bench]]
name = "croner_bench"
harness = false
required-features = ["chrono"]

[[example]]
name = "simple_demo"
required-features = ["chrono"]

[[example]]
name = "iter_demo"
required-features = ["chrono"]

[[example]]
name = "timezone_demo"
required-features = ["chrono"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
