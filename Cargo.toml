[package]
name = "croner"
version = "3.0.1"
edition = "2021"
license = "MIT"
description = "Fully-featured, lightweight, and efficient Rust library designed for parsing and evaluating cron patterns"
repository = "https://github.com/hexagon/croner-rust"
documentation = "https://docs.rs/croner"
readme = "README.md"
keywords = ["cron", "scheduler", "job", "task", "time"]
categories = ["date-and-time", "parser-implementations", "no-std"]
homepage = "https://github.com/hexagon/croner-rust"

[lib]
name = "croner"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["alloc"] }
serde = { version = "1.0", optional = true, default-features = false }
strum = { version = "0.27.2", default-features = false, features = ["derive"] }

[dev-dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"
criterion = "0.7.0"
rstest = "0.26.1"
serde_test = "1.0"

[features]
default = ["std"]
std = [
    "chrono/std",
    "strum/std",
    "serde?/std",
]
serde = ["dep:serde"]

[[bench]]
name = "croner_bench"
harness = false
