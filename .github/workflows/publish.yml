on:
  push:
    # Pattern matched against refs/tags
    tags:
      - 'v*'           # Push events to every tag containing v
  workflow_dispatch:

name: Publish

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi

      - name: Run tests
        run: cargo test

      - name: Run tests with features (including both jiff and chrono)
        run: cargo test --all-features

      - name: Run tests (jiff standalone)
        run: cargo test --no-default-features --features jiff

      - name: Build no_std (thumbv7m-none-eabi)
        run: |
          cargo build --target thumbv7m-none-eabi --no-default-features --features chrono,serde
          cargo build --target thumbv7m-none-eabi --no-default-features --features jiff

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
