name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run tests with features
      run: cargo test --all-features --verbose
    - name: Run tests (jiff standalone)
      run: cargo test --no-default-features --features jiff --verbose
    - name: Build no_std (thumbv7m-none-eabi)
      run: |
        rustup target add thumbv7m-none-eabi
        cargo build --verbose --target thumbv7m-none-eabi --no-default-features
        cargo build --verbose --target thumbv7m-none-eabi --no-default-features --features chrono
        cargo build --verbose --target thumbv7m-none-eabi --no-default-features --features serde
        cargo build --verbose --target thumbv7m-none-eabi --no-default-features --features chrono,serde
        cargo build --verbose --target thumbv7m-none-eabi --no-default-features --features jiff

  msrv:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # The minimum supported Rust version, `rust-version` in Cargo.toml.
    - name: Test with Rust 1.85
      run: |
        rustup toolchain install 1.85 --profile minimal
        cargo +1.85 test --verbose
        cargo +1.85 test --verbose --all-features
        cargo +1.85 test --verbose --no-default-features --features jiff
